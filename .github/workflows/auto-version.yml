name: GreasyFork-Style Version Bump

on:
  push:
    branches:
      - main
    paths:
      - '*.js'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bump @version and URLs only for changed scripts
        run: |
          python3 -c '
          import re, subprocess, os, urllib.parse

          repo_raw_base = "https://raw.githubusercontent.com/3soob/kaauh_lab_script/main"

          # Find only the .js files modified in the latest push
          diff = subprocess.check_output(["git", "diff", "--name-only", "HEAD~1", "HEAD"]).decode("utf-8")
          changed_files = [f.strip() for f in diff.splitlines() if f.strip().endswith(".js") and os.path.exists(f.strip())]

          for filepath in changed_files:
              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              # Skip plain JS files that do not have a ==UserScript== header
              if "==UserScript==" not in content:
                  print(f"Skipping {filepath} (no ==UserScript== header)")
                  continue

              encoded_name = urllib.parse.quote(filepath)
              raw_url = f"{repo_raw_base}/{encoded_name}"

              # 1. Bump last numeric segment of @version (supports 1.0, 1.0.0, etc.)
              def bump(match):
                  prefix, head, last = match.groups()
                  return f"{prefix}{head}{int(last) + 1}"

              updated, count = re.subn(r"(//\s*@version\s+)([\d.]+\.)(\d+)", bump, content, count=1)
              print(f"{filepath}: matched @version = {count}")

              # 2. Remove existing @updateURL / @downloadURL to avoid duplicates
              updated = re.sub(r"^//\s*@(updateURL|downloadURL)\s+.*\r?\n?", "", updated, flags=re.MULTILINE)

              # 3. Insert @updateURL and @downloadURL right after @version
              url_block = f"\n// @updateURL    {raw_url}\n// @downloadURL  {raw_url}"
              updated = re.sub(r"(//\s*@version\s+[^\r\n]+)", r"\1" + url_block, updated, count=1)

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(updated)
          '

      - name: Commit updated userscript
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump @version and sync URLs [skip ci]" && git push)
