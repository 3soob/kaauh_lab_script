$yaml = @"
name: GreasyFork-Style Version Bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.js'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump @version and sync URLs across all repo scripts
        run: |
          python3 -c '
          import os, re, urllib.parse

          repo_raw_base = "https://raw.githubusercontent.com/3soob/kaauh_lab_script/main"

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".")]

              for filename in files:
                  if not filename.endswith(".js"):
                      continue

                  rel_path = os.path.relpath(os.path.join(root, filename), ".").replace("\\", "/")

                  with open(rel_path, "r", encoding="utf-8") as f:
                      content = f.read()

                  if "==UserScript==" not in content:
                      print(f"Skipping {rel_path} (no ==UserScript== header)")
                      continue

                  encoded_path = urllib.parse.quote(rel_path)
                  raw_url = f"{repo_raw_base}/{encoded_path}"

                  def bump(match):
                      prefix, head, last = match.groups()
                      return f"{prefix}{head}{int(last) + 1}"

                  updated, count = re.subn(r"(//\s*@version\s+)([\d.]+\.)(\d+)", bump, content, count=1)

                  updated = re.sub(r"^//\s*@(updateURL|downloadURL)\s+.*\r?\n?", "", updated, flags=re.MULTILINE)

                  url_block = f"\n// @updateURL    {raw_url}\n// @downloadURL  {raw_url}"
                  updated = re.sub(r"(//\s*@version\s+[^\r\n]+)", r"\1" + url_block, updated, count=1)

                  with open(rel_path, "w", encoding="utf-8") as f:
                      f.write(updated)

                  print(f"Updated {rel_path} -> matched @version: {count}")
          '

      - name: Commit updated userscripts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump @version and sync URLs [skip ci]" && git push)
"@

New-Item -ItemType Directory -Force -Path ".github\workflows" | Out-Null
[System.IO.File]::WriteAllText("$PWD\.github\workflows\auto-version.yml", $yaml)
git pull --rebase
git add .github/workflows/auto-version.yml
git commit -m "fix: restore valid YAML indentation"
git push
